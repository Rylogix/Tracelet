name: Deploy Cloudflare
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cloudflare-production
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npm run build:cloudflare
        working-directory: frontend
      - run: npm ci && npm test && npm run build
        working-directory: cloudflare
      - name: Create or reuse Tracelet database
        run: node scripts/provision.mjs database
        working-directory: cloudflare
      - name: Apply database migrations and deploy
        run: npm run migrate:remote && npm run deploy
        working-directory: cloudflare
      - name: Create encryption key if missing
        run: node scripts/provision.mjs secret
        working-directory: cloudflare
